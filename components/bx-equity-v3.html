  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  .hero {
    position: relative;
    display: flex;
    height: 100vh;
    width: 100%;
    align-items: center;
    overflow: hidden;
    padding: 96px 24px;
    background: linear-gradient(90deg, #002117 0%, #125E47 100%);
  }

  @media (min-width: 640px) {
    .hero {
      padding: 96px 64px;
    }
  }

  @media (min-width: 1024px) {
    .hero {
      padding: 96px 112px;
    }
  }

  .hero__bg {
    position: absolute;
    right: 0;
    top: 0;
    height: 100%;
    width: auto;
    object-fit: contain;
    object-position: right;
    pointer-events: none;
  }

  .hero__scrim {
    display: none;
  }

  @media (max-width: 1023px) {
    .hero__scrim {
      display: block;
      position: absolute;
      inset: 0;
      z-index: 5;
      background: linear-gradient(90deg, rgba(0,33,23,0.7) 0%, rgba(0,33,23,0.4) 28%, rgba(0,33,23,0.1) 45%, rgba(0,33,23,0) 58%);
      pointer-events: none;
    }
  }

  .hero__content {
    position: relative;
    z-index: 10;
    display: flex;
    width: 100%;
    max-width: 524px;
    flex-direction: column;
    align-items: flex-start;
    gap: 48px;
    text-align: left;
  }

  .hero__lockup {
    height: 72px;
    width: auto;
    max-width: 100%;
  }

  @media (min-width: 640px) {
    .hero__lockup {
      height: 96px;
    }
  }

  .hero__paragraph {
    max-width: 524px;
    font-family: 'Produkt', serif;
    font-weight: 400;
    font-size: 16px;
    font-style: normal;
    line-height: 1.4;
    color: rgba(255, 255, 255, 0.72);
    text-align: left;
    margin: 0;
  }
</style>
