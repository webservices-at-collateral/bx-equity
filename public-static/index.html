<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BX Equity — Forward Thinking Investments</title>
<meta name="description" content="A real estate platform that buys undervalued and transitional assets, then manages them on-site rather than handing them off." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet" />

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  .hero {
    position: relative;
    display: flex;
    height: 100vh;
    width: 100%;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 96px 24px;
    background: linear-gradient(90deg, #002117 0%, #125E47 100%);
  }

  .hero__content {
    position: relative;
    z-index: 10;
    display: flex;
    max-width: 640px;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .hero__logo {
    height: 40px;
    width: auto;
  }

  @media (min-width: 640px) {
    .hero__logo {
      height: 48px;
    }
  }

  .hero__copy {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin-top: 32px;
  }

  .hero__subheading {
    font-family: 'Produkt', 'Playfair Display', serif;
    font-weight: 400;
    font-size: 40px;
    font-style: normal;
    line-height: 120%;
    letter-spacing: 0%;
    color: #FFF;
    text-align: center;
  }

  .hero__paragraph {
    max-width: 560px;
    font-family: 'Produkt', 'Playfair Display', serif;
    font-weight: 400;
    font-size: 16px;
    font-style: normal;
    line-height: 150%;
    letter-spacing: 0%;
    color: rgba(255, 255, 255, 0.72);
    text-align: center;
    margin: 0;
  }

  @media (min-width: 640px) {
    .hero__paragraph {
      font-size: 19px;
    }
  }

  .hero__badge {
    margin-top: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .hero__badge-dot {
    height: 8px;
    width: 8px;
    background: #ffffff;
  }

  .hero__badge-text {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #ffffff;
  }
</style>
</head>

    <div class="hero__copy">
      <h2 class="hero__subheading">Forward Thinking Investments</h2>
      <p class="hero__paragraph">
        A real estate platform that buys undervalued and transitional assets, then manages them on-site rather than handing them off. That ownership work sharpens how BX Capital underwrites and turns up deals for BX Equity.
